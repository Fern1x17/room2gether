name: room2gether
description: "App móvil para encontrar compañeros de piso."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2
  # Versión mínima de Flutter. Sin esto, un SDK viejo no falla: resuelve
  # `pubspec.lock` hacia atrás y la diferencia pasa por un cambio real.
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.9.0

  # Navegación
  go_router: ^15.1.2

  # Variables de entorno
  flutter_dotenv: ^5.2.1

  # Google Places (autocompletado de ciudades y direcciones, RF-15)
  flutter_google_places_sdk: ^0.4.3

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  diacritic: ^0.1.6

  # Recorte y compresión del avatar (CU-04). Ambos son Dart/Flutter puro:
  # funcionan igual en Android y en web sin código nativo ni scripts externos.
  crop_your_image: ^2.0.0
  image: ^4.5.4
  # Solo para core/utils/image_downscaler_web.dart (import condicional): en web
  # la foto la decodifica el navegador, no el heap de WebAssembly.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FF6B5B"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FF6B5B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFF8F5"
    theme_color: "#FF6B5B"
